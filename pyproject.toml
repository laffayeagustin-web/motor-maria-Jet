[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jet-maria-motor"
version = "0.1.0"
description = "Motor del Índice de Visibilidad IA (Jet MarIA), partido en dos herramientas: maria (servidor) y maria-render (notebook)."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.6",
    "typer>=0.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Perfil notebook: agrega el navegador. El servidor NO instala esto.
render = ["playwright==1.62.0"]
dev = ["pytest>=8", "jsonschema>=4.21"]

[project.scripts]
maria = "maria.cli:app"
maria-render = "maria_render.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "render: necesita un navegador (Playwright/Chromium). Fuera del CI base.",
    "network: toca la red. Fuera del CI base.",
]
addopts = "-m 'not render and not network'"
