# Panel ES — Índice Jet MarIA
# Panel de aviación ejecutiva del mercado español / europeo.
# 15 cuentas, todas con sitio propio.
# Grupos: A = operadores y brokers con base en España · B = extranjeros que
# capturan demanda española · C = referencia del mercado.
# `flujo` es una anotación del analista; sin clasificar firme -> "mixto".

cuentas:
